name: Healthcheck

# 本番が動いているかを、3 時間ごとに外から確かめる（仕様書 §11.8）。
# リポジトリを非公開にすると Actions の時間に無料枠があり（1 回ごとに 1 分に切り上げて数える）、30 分ごとでは枠の大半を使うため、
# 3 時間ごと（月 約 240 分）にする。すぐ気づくための見張りは、外部の監視サービスで 5 分ごとに行う（README）
# 失敗すると、GitHub がこのワークフローの失敗を知らせる（既定ではメール。通知の設定は GitHub の Settings → Notifications → Actions）
on:
  schedule:
    # ちょうど 0 分は GitHub の定時の起動が混み、遅れたり飛ばされたりしやすいので、ずらす
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: 主なページとデータベースを確かめる
        run: |
          set -u
          site="${SITE:-https://takoshin.daigakunote.com}"
          failed=0
          for path in / /new /types /api/health; do
            # 一時的な揺れで知らせないよう、間を空けて 3 回まで試す
            ok=0
            for i in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$site$path" || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 20
            done
            echo "$path → $code"
            [ "$ok" = 1 ] || failed=1
          done
          exit $failed
