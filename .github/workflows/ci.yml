name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub の権限は読むだけにする（このワークフローはリポジトリに書き込まない）
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: takoshin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # 組み込みの PostgreSQL（PGlite）で
      - run: npm test
      # 本物の PostgreSQL で（同時に送られたときの締め切りを、行の鍵で確かめる）
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/takoshin
      - run: npm run build
      # Cloudflare Workers 向けのビルドも通ることを確かめる
      - run: npx opennextjs-cloudflare build
