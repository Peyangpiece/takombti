name: Deploy

# main に入ったら Cloudflare Workers に公開する。
# 必要な GitHub のシークレット（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  … 「Edit Cloudflare Workers」の権限を持つ API トークン
#                           （Hyperdrive を使うには、加えて「Hyperdrive の編集」の権限。
#                            独自ドメインには、daigakunote.com の「Workers Routes の編集」と「DNS の編集」の権限）
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
#   DATABASE_URL          … PostgreSQL の接続文字列（Workers のシークレットとして登録する）
#   CRON_SECRET           … 定時処理の合言葉（同上）
#   ADMIN_TOKEN           … 運営者のページ（/admin）の合言葉。32 文字以上の乱数（同上）
# 必要な GitHub の変数（Variables）：
#   NEXT_PUBLIC_SITE_URL  … 公開するアドレス（https://takoshin.daigakunote.com）
#   NEXT_PUBLIC_SUPPORT_URL … 結果の画面の「応援する」の行き先（外部の応援サービスのページ。https）。
#                             なければ応援のお願いを出さない
# シークレットがまだなければ、公開の手順は飛ばす（失敗にはしない）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# GitHub の権限は読むだけにする（このワークフローはリポジトリに書き込まない）
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPPORT_URL: ${{ vars.NEXT_PUBLIC_SUPPORT_URL }}
    steps:
      - name: シークレットがあるか確かめる
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未設定なので、公開を飛ばします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - name: Hyperdrive を用意する
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/hyperdrive.mjs
      - if: steps.ready.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build
      - if: steps.ready.outputs.ok == 'true'
        # OpenNext は公開の前に、手元用の仮の環境を立ち上げる。そのとき Hyperdrive の
        # 結び付けには手元用の接続文字列が要る（接続はしない）。本番は Hyperdrive の ID でつなぐ
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://user:password@127.0.0.1:5432/takoshin
        run: npx wrangler deploy
      - name: Workers のシークレットを登録する
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "$DATABASE_URL" ]; then printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL; fi
          if [ -n "$CRON_SECRET" ]; then printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET; fi
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; fi
