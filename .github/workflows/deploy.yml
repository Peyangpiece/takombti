name: Deploy

# main に入ったら、CI（.github/workflows/ci.yml）がすべて通ったあとで、Cloudflare Workers に公開する。
# CI が失敗したコミットは公開しない（CI の終わりを待ってから動き、CI が確かめたコミットそのものを公開する）。
# 必要な GitHub のシークレット（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  … 「Edit Cloudflare Workers」の権限を持つ API トークン
#                           （Hyperdrive を使うには、加えて「Hyperdrive の編集」の権限。
#                            独自ドメインには、daigakunote.com の「Workers Routes の編集」と「DNS の編集」の権限）
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
#   DATABASE_URL          … PostgreSQL の接続文字列（Workers のシークレットとして登録する）
#   CRON_SECRET           … 定時処理の合言葉（同上）
#   ADMIN_TOKEN           … 運営者のページ（/admin）の合言葉。32 文字以上の乱数（同上）
#   STRIPE_SECRET_KEY     … 特典つきの応援に使う Stripe のシークレットキー（任意。同上）
#   STRIPE_WEBHOOK_SECRET … Stripe の Webhook の署名の鍵（whsec_…。任意。同上）
# 必要な GitHub の変数（Variables）：
#   NEXT_PUBLIC_SITE_URL  … 公開するアドレス（https://takoshin.daigakunote.com）
#   NEXT_PUBLIC_SUPPORT_URL … 結果の画面の「応援する」の行き先（外部の応援サービスのページ。https）。
#                             なければ応援のお願いを出さない
#   SUPPORT_PRICE_YEN     … 特典つきの応援のいちばん安い金額（円。50〜10000。任意。Workers のシークレットとして登録する）
#   SUPPORT_TIERS_YEN     … 選べる金額（「300,500,1000」の形。任意。なければ、いちばん安い金額と 500 円・1,000 円）
# シークレットがまだなければ、公開の手順は飛ばす（失敗にはしない）。

on:
  # CI が終わったとき（下の if で、main への push の CI が成功したときだけに絞る）
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # 手で動かすとき（Actions の「Run workflow」）。選んだブランチの最新のコミットを公開する
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# GitHub の権限は読むだけにする（このワークフローはリポジトリに書き込まない）
permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPPORT_URL: ${{ vars.NEXT_PUBLIC_SUPPORT_URL }}
    steps:
      - name: シークレットがあるか確かめる
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未設定なので、公開を飛ばします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          # CI が確かめたコミット（CI のあとに main へ入った、まだ確かめていないコミットは公開しない）
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - name: Hyperdrive を用意する
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/hyperdrive.mjs
      - if: steps.ready.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build
      # 公開の前に作ったページ（トップ・16 タイプの紹介など）を、Workers の静的ファイルの置き場へ写す。
      # 毎回作り直さずに、写したものを返すため（open-next.config.ts）
      - if: steps.ready.outputs.ok == 'true'
        # 設定を読むときに Hyperdrive の結び付けを確かめるので、下の公開と同じ手元用の接続文字列を渡す（接続はしない）
        env:
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://user:password@127.0.0.1:5432/takoshin
        run: npx opennextjs-cloudflare populateCache remote
      # シークレットは、公開と同じ 1 回でいっしょに渡す（`wrangler deploy --secrets-file`）。
      # 公開のあとに `wrangler secret put` で 1 つずつ登録すると、そのたびに新しい版が公開され、
      # 新しいコードがシークレットのないまま（または一部だけで）短いあいだ動いてしまうため。
      # 値は環境変数から node でファイルに書き（表示しない）、空の値は渡さない（前に登録した値を残す）。
      # ファイルは作業の一時フォルダに、本人だけが読める形で作り、終わったら（失敗しても）消す
      - name: シークレットといっしょに公開する
        if: steps.ready.outputs.ok == 'true'
        env:
          # OpenNext は公開の前に、手元用の仮の環境を立ち上げる。そのとき Hyperdrive の
          # 結び付けには手元用の接続文字列が要る（接続はしない）。本番は Hyperdrive の ID でつなぐ
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://user:password@127.0.0.1:5432/takoshin
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SUPPORT_PRICE_YEN: ${{ vars.SUPPORT_PRICE_YEN }}
          SUPPORT_TIERS_YEN: ${{ vars.SUPPORT_TIERS_YEN }}
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/workers-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          umask 077
          SECRETS_FILE="$secrets_file" node -e '
            const names = ["DATABASE_URL", "CRON_SECRET", "ADMIN_TOKEN", "STRIPE_SECRET_KEY",
              "STRIPE_WEBHOOK_SECRET", "SUPPORT_PRICE_YEN", "SUPPORT_TIERS_YEN"];
            const out = {};
            for (const n of names) if (process.env[n]) out[n] = process.env[n];
            require("node:fs").writeFileSync(process.env.SECRETS_FILE, JSON.stringify(out), { mode: 0o600 });
            console.log(`シークレット ${Object.keys(out).length} 個をいっしょに渡します（${Object.keys(out).join("・") || "なし"}）`);
          '
          if [ "$(cat "$secrets_file")" = "{}" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy --secrets-file "$secrets_file"
          fi
