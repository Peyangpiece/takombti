name: Deploy

# main に入ったら Cloudflare Workers に公開する。
# 必要な GitHub のシークレット（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN  … 「Edit Cloudflare Workers」の権限を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID … Cloudflare のアカウント ID
#   DATABASE_URL          … PostgreSQL の接続文字列（Workers のシークレットとして登録する）
#   CRON_SECRET           … 定時処理の合言葉（同上）
# 必要な GitHub の変数（Variables）：
#   NEXT_PUBLIC_SITE_URL  … 公開するアドレス（例：https://takoshin.example.workers.dev）
#   NEXT_PUBLIC_CONTACT_URL … 問い合わせフォームのアドレス（Google フォームなど。なければ「準備中」と表示）
# シークレットがまだなければ、公開の手順は飛ばす（失敗にはしない）。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_CONTACT_URL: ${{ vars.NEXT_PUBLIC_CONTACT_URL }}
    steps:
      - name: シークレットがあるか確かめる
        id: ready
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未設定なので、公開を飛ばします"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.ready.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: npx opennextjs-cloudflare build
      - if: steps.ready.outputs.ok == 'true'
        run: npx wrangler deploy
      - name: Workers のシークレットを登録する
        if: steps.ready.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$DATABASE_URL" ]; then printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL; fi
          if [ -n "$CRON_SECRET" ]; then printf '%s' "$CRON_SECRET" | npx wrangler secret put CRON_SECRET; fi
